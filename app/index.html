<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAVEPX</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="logo">WAVEPX</h1>
      <span class="tagline">data over sound</span>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="draw">Draw</button>
      <button class="tab" data-tab="qr">QR Code</button>
      <button class="tab" data-tab="text">Text</button>
      <button class="tab" data-tab="arena">Arena</button>
      <button class="tab" data-tab="game">Game</button>
    </nav>

    <main class="panels">
      <div class="panel-row">
        <section class="panel send-panel">
          <h2 class="panel-title">SEND</h2>

          <!-- Draw tab -->
          <div class="tab-content active" id="tab-draw">
            <div class="grid-controls">
              <label>Grid:
                <select id="grid-size">
                  <option value="8">8x8</option>
                  <option value="16" selected>16x16</option>
                  <option value="24">24x24</option>
                  <option value="32">32x32</option>
                  <option value="64">64x64</option>
                  <option value="128">128x128</option>
                  <option value="256">256x256</option>
                  <option value="512">512x512</option>
                </select>
              </label>
              <label>Mode:
                <select id="color-mode">
                  <option value="bw" selected>B&W</option>
                  <option value="gray4">4 gray</option>
                  <option value="gray16">16 gray</option>
                  <option value="color16">16 color</option>
                </select>
              </label>
              <label>Dither:
                <select id="dither-mode">
                  <option value="none">None</option>
                  <option value="floyd-steinberg">Floyd-Steinberg</option>
                  <option value="atkinson">Atkinson</option>
                </select>
              </label>
              <button id="clear-canvas" class="btn-small">Clear</button>
              <label class="btn-small upload-btn">
                Load Image
                <input type="file" id="image-upload" accept="image/*" hidden />
              </label>
            </div>
            <canvas id="pixel-canvas" width="320" height="320"></canvas>
            <div id="chunk-info" class="chunk-info"></div>
          </div>

          <!-- QR tab -->
          <div class="tab-content" id="tab-qr">
            <textarea id="qr-input" placeholder="Enter text or URL..." rows="3"></textarea>
            <div class="qr-options">
              <label>EC Level:
                <select id="qr-ec">
                  <option value="0">L (7%)</option>
                  <option value="1" selected>M (15%)</option>
                  <option value="2">Q (25%)</option>
                  <option value="3">H (30%)</option>
                </select>
              </label>
            </div>
            <canvas id="qr-preview" width="320" height="320"></canvas>
          </div>

          <!-- Text tab -->
          <div class="tab-content" id="tab-text">
            <textarea id="text-input" placeholder="Type a message..." rows="5" maxlength="138"></textarea>
            <div class="byte-counter"><span id="byte-count">0</span>/138 bytes</div>
          </div>

          <!-- Arena tab -->
          <div class="tab-content" id="tab-arena">
            <div id="arena-container"></div>
          </div>

          <!-- Game tab -->
          <div class="tab-content" id="tab-game">
            <div class="game-layout">
              <div class="game-grid-section">
                <div class="game-grid-label">YOUR FLEET</div>
                <canvas id="game-my-grid" width="256" height="256"></canvas>
              </div>
              <div class="game-grid-section">
                <div class="game-grid-label">TARGET</div>
                <canvas id="game-target-grid" width="256" height="256"></canvas>
              </div>
            </div>
            <div id="game-status" class="game-status">Place your ships</div>
            <div class="game-controls">
              <button id="game-rotate" class="btn-small">Rotate</button>
              <button id="game-ready" class="btn-small">Ready</button>
              <button id="game-new" class="btn-small">New Game</button>
            </div>
          </div>
        </section>

        <section class="panel receive-panel">
          <h2 class="panel-title">RECEIVE</h2>
          <div id="receive-display">
            <div class="receive-placeholder">Listening for transmissions...</div>
          </div>
          <div id="receive-info" class="receive-info"></div>
        </section>
      </div>
    </main>

    <footer class="controls">
      <div class="controls-row">
        <label>Protocol:
          <select id="protocol-select">
            <option value="0">Audible Normal</option>
            <option value="1" selected>Audible Fast</option>
            <option value="2">Audible Fastest</option>
            <option value="3">Ultrasound Normal</option>
            <option value="4">Ultrasound Fast</option>
            <option value="5">Ultrasound Fastest</option>
            <option value="6">DT800 Normal</option>
            <option value="7">DT800 Fast</option>
            <option value="8">DT800 Fastest</option>
          </select>
        </label>
        <label class="volume-label">Volume:
          <input type="range" id="volume-slider" min="0" max="100" value="50" />
          <span id="volume-value">50%</span>
        </label>
      </div>
      <div class="controls-row">
        <button id="btn-listen" class="btn">Start Listening</button>
        <button id="btn-send" class="btn btn-primary">SEND</button>
        <button id="btn-pause" class="btn btn-pause" hidden>PAUSE</button>
        <button id="btn-stop" class="btn btn-stop" hidden>STOP</button>
        <button id="btn-download" class="btn">WAV</button>
      </div>
      <div class="transfer-bar" id="transfer-bar" hidden>
        <div class="transfer-fill" id="transfer-fill"></div>
        <span class="transfer-text" id="transfer-text"></span>
      </div>
      <div class="status-bar" id="status-bar">
        <span id="status-state">Status: Idle</span>
        <canvas id="audio-visualizer" width="200" height="28"></canvas>
        <span id="status-payload"><span id="payload-size">0</span> B <span id="chunk-count"></span></span>
      </div>
    </footer>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
